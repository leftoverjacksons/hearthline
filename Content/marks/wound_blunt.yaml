id: wound_blunt
name: Broken bone
category: wound
regions: [head, face, torso, arm_l, arm_r, hand_l, hand_r, leg_l, leg_r]
heritable: none
damage_types: [blunt]
origin_text: "Broken by {cause}[ at {place}], {season} of year {year}"
initial_stage: fresh
stages:
  - id: fresh
    effects:
      - { stat: stamina, mul: 0.7 }
      - { stat: carry_capacity, mul: 0.6 }
      - { reaction: bleeding }
    visual: { decal: wound_blunt_fresh }
    after_days: 4
    then: [{ to: infected }]
  - id: stabilized
    effects:
      - { stat: stamina, mul: 0.85 }
      - { reaction: bleeding }
    visual: { decal: wound_blunt_bound }
    after_days: 12
    then: [{ to: infected }]
  - id: infected
    effects:
      - { stat: stamina, mul: 0.5 }
      - { stat: move_speed, mul: 0.8 }
      - { reaction: feverish }
    visual: { decal: wound_blunt_infected }
    after_days: 8
    then:
      - { resolve: loss, weight: 2 }
      - { resolve: bad_scar, weight: 1 }
  - id: healing
    effects:
      - { stat: stamina, mul: 0.9 }
    visual: { decal: wound_blunt_bound }
    after_days: 24
    then: [{ resolve: treated }]
outcomes:
  clean_scar: [{ def: scar_knit_bone }]
  bad_scar: [{ def: scar_crooked_bone }]
  loss:
    - { def: loss_eye, regions: [face] }
    - { def: loss_fingers, regions: [hand_l, hand_r] }
    - { def: loss_weak_arm, regions: [arm_l, arm_r] }
    - { def: loss_limp, regions: [leg_l, leg_r] }
